    <title>jnzheng</title>
    <link rel="stylesheet" href="styles.css">

    <script type="text/javascript">
        // time zone formatting
        let options = {
            timeZone: 'US/Eastern',
            hour: 'numeric',
            minute: 'numeric',
            second: 'numeric',
        };
        let formatter = new Intl.DateTimeFormat([], options);

        // set time
        setInterval(() => {
            document.querySelector("#time").innerText = formatter.format(new Date());
        }, 1000);
    </script>
</head>

<body>
    <p>
        <font size="8" class="name"><i><b>JOHNNY ZHENG</b></i></font> <br><br>

                <a>TIME IN BLOOMINGTON</a> - <span id="time">00:00:00 PM</span> <a>EST</a>
            </i>
        </span>
